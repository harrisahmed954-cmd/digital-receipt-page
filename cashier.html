<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cashier Screen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: white;
    }
    .card {
      background: #16213e;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .status {
      font-size: 14px;
      color: #888;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00c853;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .waiting {
      color: #888;
      font-size: 18px;
      padding: 40px 0;
    }
    .customer-box {
      display: none;
      background: #0f3460;
      border-radius: 16px;
      padding: 30px;
      margin-top: 10px;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .customer-box .label {
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .customer-box .name {
      font-size: 26px;
      font-weight: bold;
      color: #e2e2e2;
      margin-bottom: 16px;
    }
    .customer-box .email {
      font-size: 18px;
      color: #00c853;
      font-weight: bold;
      word-break: break-all;
    }
    .time {
      font-size: 12px;
      color: #555;
      margin-top: 16px;
    }
    .clear-btn {
      margin-top: 24px;
      padding: 10px 28px;
      background: #e53935;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 20px;
    }
    .clear-btn:hover { background: #c62828; }
    h1 { font-size: 20px; color: #e2e2e2; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #555; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🖥️ Cashier Screen</h1>
    <p class="subtitle">Waiting for customer to scan QR code...</p>
    <div class="status">
      <div class="dot"></div>
      <span>Live — checking every 3 seconds</span>
    </div>

    <div class="waiting" id="waiting-msg">
      📱 No customer connected yet
    </div>

    <div class="customer-box" id="customer-box">
      <div class="label">Customer Name</div>
      <div class="name" id="customer-name"></div>
      <div class="label">Email Address</div>
      <div class="email" id="customer-email"></div>
      <div class="time" id="customer-time"></div>
      <br/>
      <button class="clear-btn" onclick="clearCustomer()">✖ Clear & Wait for Next</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://byghyygbilpqimtvhbok.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5Z2h5eWdiaWxwcWltdHZoYm9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MTQ5MzgsImV4cCI6MjA5NDM5MDkzOH0.4YVQ62yA1VUdf6b7mpez8P1mZPc6PiDlG_S1yDurT4k";

    let lastSeenId = null;

    async function checkNewCustomer() {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/customers?order=created_at.desc&limit=1`,
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        }
      );
      const data = await res.json();
      if (data && data.length > 0) {
        const latest = data[0];
        if (latest.id !== lastSeenId) {
          lastSeenId = latest.id;
          showCustomer(latest);
        }
      }
    }

    function showCustomer(customer) {
      document.getElementById("waiting-msg").style.display = "none";
      document.getElementById("customer-box").style.display = "block";
      document.getElementById("customer-name").textContent = customer.name || "Unknown";
      document.getElementById("customer-email").textContent = customer.email;
      document.getElementById("customer-time").textContent =
        "Connected at: " + new Date(customer.created_at).toLocaleTimeString();
    }

    function clearCustomer() {
      document.getElementById("customer-box").style.display = "none";
      document.getElementById("waiting-msg").style.display = "block";
    }

    setInterval(checkNewCustomer, 3000);
    checkNewCustomer();
  </script>
</body>
</html>
